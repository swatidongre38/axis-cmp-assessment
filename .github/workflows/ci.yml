name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Static analysis
        run: ./gradlew detekt
      - name: Unit tests (common code on JVM) + Android build
        run: ./gradlew testDebugUnitTest :composeApp:assembleDebug

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Common tests on iOS simulator (Kotlin/Native)
        run: ./gradlew iosSimulatorArm64Test
      - name: Build XCFramework
        run: ./gradlew :composeApp:assembleComposeAppReleaseXCFramework
